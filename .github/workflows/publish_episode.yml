name: Publish Episode Video to YouTube

on:
  workflow_dispatch:
    inputs:
      google_drive_file_id:
        description: "Google Drive file ID for the private MP4"
        required: true
        type: string
      title:
        description: "YouTube title"
        required: true
        default: "Kathaikalam | Tamil Animated Story — One-Shot Test"
        type: string
      privacy:
        description: "Upload visibility"
        required: true
        default: "unlisted"
        type: choice
        options:
          - unlisted
          - private
          - public
      made_for_kids:
        description: "Mark as made for kids only if the content is directed to children"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_DRIVE_FILE_ID: ${{ inputs.google_drive_file_id }}
      YOUTUBE_TITLE: ${{ inputs.title }}
      YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy }}
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Google API libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2
      - name: Download private MP4 from Google Drive
        run: python app/download_drive_video.py
      - name: Validate downloaded video
        run: |
          test -s input/episode.mp4
          file input/episode.mp4
          ls -lh input/episode.mp4
      - name: Upload video to YouTube
        run: python app/youtube_uploader.py

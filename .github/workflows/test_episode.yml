name: Test Episode Director

on:
  workflow_dispatch:

jobs:
  episode-test:

    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # 3. INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # 4. GENERATE STORY ARC
      # =====================================================

      - name: Generate Story Arc
        run: |
          python ai/arc_director.py


      # =====================================================
      # 5. VERIFY GENERATED ARC
      # =====================================================

      - name: Verify generated arc
        run: |
          echo "Checking generated arc..."

          if [ ! -f output/generated_arc.json ]; then
            echo "ERROR: generated_arc.json was not created."
            exit 1
          fi

          echo "✅ generated_arc.json found."

          python -m json.tool output/generated_arc.json > /dev/null

          echo "✅ generated_arc.json is valid JSON."


      # =====================================================
      # 6. GENERATE EPISODE 1
      # =====================================================

      - name: Generate Episode 1
        run: |
          python ai/episode_director.py


      # =====================================================
      # 7. VERIFY GENERATED EPISODE
      # =====================================================

      - name: Verify generated episode
        run: |
          echo "Checking generated episode..."

          if [ ! -f output/generated_episode_01.json ]; then
            echo "ERROR: generated_episode_01.json was not created."
            exit 1
          fi

          echo "✅ generated_episode_01.json found."

          python -m json.tool output/generated_episode_01.json > /dev/null

          echo "✅ generated_episode_01.json is valid JSON."

      - name: Update Universe Memory from Episode
        run: |
          echo "Updating universe memory from generated episode..."
          python universe/memory_manager.py
          echo "✅ Universe memory updated."

      - name: Generate Flow Scene Files
        run: |
          echo "Generating Google Flow-ready scene files..."
          python ai/scene_director.py
          echo "✅ Scene files generated."

      - name: Verify generated scenes
        run: |
          if [ ! -f output/scenes/index.json ]; then
            echo "❌ Scene index not found"
            exit 1
          fi

          scene_count=$(find output/scenes -name "scene_*.json" | wc -l)

          if [ "$scene_count" -ne 8 ]; then
            echo "❌ Expected 8 scene files, found $scene_count"
            exit 1
          fi

          echo "✅ Found $scene_count scene files"

          for file in output/scenes/scene_*.json; do
            python -m json.tool "$file" > /dev/null
          done

          echo "✅ All scene JSON files are valid."

      - name: Upload Flow scene files
        uses: actions/upload-artifact@v4
        with:
          name: flow-scene-files
          path: output/scenes/
          if-no-files-found: error   


      # =====================================================
      # 8. UPLOAD GENERATED ARC
      # =====================================================

      - name: Upload generated arc
        uses: actions/upload-artifact@v4
        with:
          name: generated-story-arc
          path: output/generated_arc.json
          if-no-files-found: error


      # =====================================================
      # 9. UPLOAD GENERATED EPISODE
      # =====================================================

      - name: Upload generated episode
        uses: actions/upload-artifact@v4
        with:
          name: generated-episode-01
          path: output/generated_episode_01.json
          if-no-files-found: error

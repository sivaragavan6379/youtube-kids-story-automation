name: Test Episode Director

on:
  workflow_dispatch:

jobs:
  episode-test:

    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # 3. INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # 4. GENERATE STORY ARC
      # =====================================================

      - name: Generate Story Arc
        run: |
          echo "Generating story arc..."
          python ai/arc_director.py
          echo "✅ Story arc generated."


      # =====================================================
      # 5. VERIFY GENERATED ARC
      # =====================================================

      - name: Verify generated arc
        run: |
          echo "Checking generated arc..."

          if [ ! -f output/generated_arc.json ]; then
            echo "❌ ERROR: generated_arc.json was not created."
            exit 1
          fi

          echo "✅ generated_arc.json found."

          python -m json.tool output/generated_arc.json > /dev/null

          echo "✅ generated_arc.json is valid JSON."


      # =====================================================
      # 6. GENERATE EPISODE 1
      # =====================================================

      - name: Generate Episode 1
        run: |
          echo "Generating Episode 1..."
          python ai/episode_director.py
          echo "✅ Episode 1 generated."


      # =====================================================
      # 7. VERIFY GENERATED EPISODE
      # =====================================================

      - name: Verify generated episode
        run: |
          echo "Checking generated episode..."

          if [ ! -f output/generated_episode_01.json ]; then
            echo "❌ ERROR: generated_episode_01.json was not created."
            exit 1
          fi

          echo "✅ generated_episode_01.json found."

          python -m json.tool output/generated_episode_01.json > /dev/null

          echo "✅ generated_episode_01.json is valid JSON."


      # =====================================================
      # 8. UPDATE UNIVERSE MEMORY
      # =====================================================

      - name: Update Universe Memory from Episode
        run: |
          echo "Updating universe memory from generated episode..."

          python universe/memory_manager.py

          echo "✅ Universe memory updated."


      # =====================================================
      # 9. GENERATE SCENE FILES
      # =====================================================

      - name: Generate Scene Files
        run: |
          echo "Generating scene files..."

          python ai/scene_director.py

          echo "✅ Scene files generated."


      # =====================================================
      # 10. VERIFY SCENE FILES
      # =====================================================

      - name: Verify generated scenes
        run: |
          echo "Checking generated scenes..."

          if [ ! -f output/scenes/index.json ]; then
            echo "❌ Scene index not found."
            exit 1
          fi

          scene_count=$(find output/scenes -name "scene_*.json" | wc -l)

          if [ "$scene_count" -ne 8 ]; then
            echo "❌ Expected 8 scene files, found $scene_count."
            exit 1
          fi

          echo "✅ Found $scene_count scene files."

          for file in output/scenes/scene_*.json; do
            python -m json.tool "$file" > /dev/null
          done

          echo "✅ All scene JSON files are valid."


      # =====================================================
      # 11. UPLOAD SCENE FILES
      # =====================================================

      - name: Upload scene files
        uses: actions/upload-artifact@v4
        with:
          name: flow-scene-files
          path: output/scenes/
          if-no-files-found: error


      # =====================================================
      # 12. GENERATE VEO SHOT FILES
      # =====================================================

      - name: Generate Veo Shot Files
        run: |
          echo "Generating Veo-ready shot files..."

          python ai/shot_director.py

          echo "✅ Shot files generated."


      # =====================================================
      # 13. VERIFY SHOT FILES
      # =====================================================

      - name: Verify generated shots
        run: |
          echo "Checking generated shot files..."

          if [ ! -f output/shots/index.json ]; then
            echo "❌ Shot index not found."
            exit 1
          fi

          shot_count=$(find output/shots -name "scene_*_shots.json" | wc -l)

          if [ "$shot_count" -lt 1 ]; then
            echo "❌ No scene shot files found."
            echo "Files currently inside output/shots:"
            find output/shots -maxdepth 1 -type f -print
            exit 1
          fi

          echo "✅ Found $shot_count scene shot files."

          for file in output/shots/scene_*_shots.json; do
            echo "Checking: $file"
            python -m json.tool "$file" > /dev/null
          done

          echo "✅ All shot JSON files are valid."

      # =====================================================
      # 14. VERIFY SHOT INDEX
      # =====================================================

      - name: Verify shot index
        run: |
          echo "Checking shot index..."

          python -m json.tool output/shots/index.json > /dev/null

          echo "✅ output/shots/index.json is valid JSON."

          python - <<'PY'
          import json

          path = "output/shots/index.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("❌ Shot index is not a JSON object.")

          if "scenes" not in data:
              raise SystemExit("❌ Shot index does not contain 'scenes'.")

          if not data["scenes"]:
              raise SystemExit("❌ Shot index contains no scenes.")

          print(f"✅ Shot index contains {len(data['scenes'])} scenes.")

          total_shots = sum(
              int(scene.get("shot_count", 0))
              for scene in data["scenes"]
          )

          print(f"✅ Total planned shots: {total_shots}")

          if total_shots < 1:
              raise SystemExit("❌ No planned shots found.")

          print("✅ Shot index verification completed.")
          PY


      # =====================================================
      # 15. UPLOAD VEO SHOT FILES
      # =====================================================

      - name: Upload Veo shot files
        uses: actions/upload-artifact@v4
        with:
          name: veo-shot-files
          path: output/shots/
          if-no-files-found: error


      # =====================================================
      # 16. BUILD KATHAIKALAM PIPELINE EXPORT
      # =====================================================

      - name: Build Kathaikalam Pipeline Export
        run: |
          echo "Building automatic Kathaikalam pipeline package..."
          python app/kathaikalam_pipeline_exporter.py
          python -m json.tool output/kathaikalam_pipeline.json > /dev/null
          echo "✅ Kathaikalam pipeline export ready."

      # =====================================================
      # 17. UPLOAD KATHAIKALAM PIPELINE
      # =====================================================

      - name: Upload Kathaikalam pipeline
        uses: actions/upload-artifact@v4
        with:
          name: kathaikalam-pipeline
          path: output/kathaikalam_pipeline.json
          if-no-files-found: error

      # =====================================================
      # 16. GENERATE ONE VEO 3.1 TEST VIDEO
      # =====================================================

      - name: Generate ONE Veo video test shot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          VEO_MODEL: "veo-3.1-generate-preview"
          VEO_MAX_SHOTS: "1"
          VEO_START_SHOT: "1"
          VEO_POLL_SECONDS: "10"
          VEO_MAX_WAIT_SECONDS: "600"
        run: |
          echo "=========================================="
          echo "      VEO 3.1 ONE-SHOT TEST"
          echo "=========================================="
          python app/veo_video_generator.py

          echo ""
          echo "Generated files:"
          find output/videos -maxdepth 3 -type f -print

      # =====================================================
      # 17. VERIFY VEO TEST VIDEO
      # =====================================================

      - name: Verify Veo test video
        run: |
          if [ ! -f output/videos/scene_01/shot_01.mp4 ]; then
            echo "❌ Veo test video was not generated"
            exit 1
          fi

          size=$(stat -c%s output/videos/scene_01/shot_01.mp4)

          if [ "$size" -le 0 ]; then
            echo "❌ Veo test video is empty"
            exit 1
          fi

          echo "✅ Veo test video exists"
          echo "Size: $size bytes"

      # =====================================================
      # 18. UPLOAD VEO TEST VIDEO
      # =====================================================

      - name: Upload Veo test video
        uses: actions/upload-artifact@v4
        with:
          name: veo-test-video
          path: output/videos/
          if-no-files-found: error

      # =====================================================
      # 19. UPLOAD GENERATED STORY ARC
      # =====================================================

      # =====================================================

      - name: Upload generated arc
        uses: actions/upload-artifact@v4
        with:
          name: generated-story-arc
          path: output/generated_arc.json
          if-no-files-found: error


      # =====================================================
      # 17. UPLOAD GENERATED EPISODE
      # =====================================================

      - name: Upload generated episode
        uses: actions/upload-artifact@v4
        with:
          name: generated-episode-01
          path: output/generated_episode_01.json
          if-no-files-found: error

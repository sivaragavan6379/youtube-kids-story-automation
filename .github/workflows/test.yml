name: YouTube Kids Story Automation

on:
  workflow_dispatch:

jobs:
  gemini-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # PYTHON
      # ============================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================
      # DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================
      # STEP 1
      # GEMINI ARC DIRECTOR
      # ============================================

      - name: Generate Story Arc
        run: |
          python ai/arc_director.py

      # ============================================
      # STEP 2
      # UNIVERSE MEMORY MANAGER
      # ============================================

      - name: Update Universe Memory
        run: |
          python universe/memory_manager.py

      # ============================================
      # STEP 3
      # SAVE UPDATED MEMORY TO GITHUB
      # ============================================

      - name: Commit updated universe memory
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add universe/universe_memory.json

          if git diff --cached --quiet; then

            echo "ℹ️ No universe memory changes to commit."

          else

            git commit -m "Update universe memory"

            git push

          fi

      # ============================================
      # STEP 4
      # UPLOAD GENERATED ARC
      # ============================================

      - name: Upload generated arc
        uses: actions/upload-artifact@v4
        with:
          name: gemini-arc-test
          path: output/generated_arc.json
          if-no-files-found: error

      # ============================================
      # STEP 5
      # UPLOAD UNIVERSE MEMORY
      # ============================================

      - name: Upload universe memory
        uses: actions/upload-artifact@v4
        with:
          name: universe-memory
          path: universe/universe_memory.json
          if-no-files-found: error
